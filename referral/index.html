    }).join("");
    var collage = (C.collage || []).slice(0, 4).map(function (u) { return '<img alt="" decoding="async" data-src="' + esc(u) + '">'; }).join("");
    var stats = (C.stats || []).map(function (s) { return '<div class="stat"><b data-to="' + esc(s[0]) + '">' + esc(s[0]) + "</b><span>" + esc(s[1]) + "</span></div>"; }).join("");
    var best = (C.bestFor || []).map(function (b) { return "<span>" + esc(b) + "</span>"; }).join("");
    var n = 0, featCount = 0;

    var feats = (C.features || []).map(function (g) {
      return '<div class="fg2 rv"><h4>' + esc(STAR) + " " + esc(g.g) + '</h4><ul class="fl3">' + g.items.map(function (f) {

  }

  /* ── Customization card ─────────────────────────────────────
     A second dialog, entirely its own: nothing here shares a name
     with the licence card's open/close/render/pick. */
  function loadFonts() {
    /* the template already loads its own fonts; optional extra stylesheet per theme */
    if (!T.fontCss || document.querySelector('link[data-sf-fonts]')) return;
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = T.fontCss; l.setAttribute("data-sf-fonts", "");
    document.head.appendChild(l);
  }

  function magnet(el, strength) {
    if (!finePointer || reduce) return;
    function at(e) {
      var r = el.getBoundingClientRect();
      el.style.setProperty("--fx", (e.clientX - r.left) + "px");
      el.style.setProperty("--fy", (e.clientY - r.top) + "px");

    }
    el.addEventListener("pointerenter", at);
    el.addEventListener("pointermove", function (e) {
      var r = at(e);

      el.style.setProperty("--my", ((e.clientY - r.top - r.height / 2) / r.height * strength).toFixed(2) + "px");
    });
    el.addEventListener("pointerleave", function (e) {
      at(e);
      el.style.setProperty("--mx", "0px");
      el.style.setProperty("--my", "0px");
    });
  }

  function countUp(el) {
    var to = parseInt(el.getAttribute("data-to"), 10);

    var t0 = null, dur = 1100;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = String(Math.round(to * e));
      if (k < 1) requestAnimationFrame(step);
    }
    el.textContent = "0";
    requestAnimationFrame(step);
  }

  function build() {
    loadFonts();
    var host = document.createElement("div");
    host.id = "sf-demo-bar";
    host.setAttribute("data-lenis-prevent", "");
    host.style.cssText = "position:fixed!important;left:0!important;top:0!important;width:0!important;height:0!important;z-index:2147483647!important;display:block!important;";
    var root = host.attachShadow({ mode: "open" });
    root.innerHTML = "<style>" + CSS + "</style>" + markup();
    document.body.appendChild(host);

    /* keep page smooth-scroll libraries from hijacking the card's own scroll */
    ["wheel", "touchmove"].forEach(function (ev) {
      host.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true });
    });

    function $(s) { return root.querySelector(s); }
    var st = $(".st"), mini = $(".mini"), ov = $(".ov"), cd = $(".cd"), sc = $(".sc"), prog = $(".prog i");
    var nudge = $(".nudge"), pv = $(".pv"), pvt = $(".pvt"), rows = $(".rows"), cta = $(".cta"), ct = $(".ct");
    var aal = $(".aal"), aag = $(".aag");
    var sel = "all", lastFocus = null, locked = null, closing = 0, imgs = false, ticking = false, showAll = false;

    [].forEach.call(root.querySelectorAll(".sb"), function (b) { magnet(b, 7); });

    function setCta(label) {

      nu.className = "cur" + (cur && !reduce ? " in" : "");
      nu.textContent = label;
      if (cur) {
        cur.className = "out";
        setTimeout(function () { if (cur.parentNode) cur.parentNode.removeChild(cur); }, reduce ? 0 : 330);
      }
      ct.appendChild(nu);
    }
    function renderAA() {
      /* a few names, never a count — the shelf grows every month */
      var list = AA.list.length ? AA.list : (C.aaNames || []);
      aal.hidden = !(sel === "all" && list.length);
      if (aal.hidden) return;
      var shown = list.filter(function (t) { return t.name !== N; }).slice(0, 7);
      shown.unshift({ name: N, category: "You're looking at it" });
      aag.innerHTML = shown.map(function (t, i) {
        return '<div class="' + (t.name === N ? "me" : "") + '" style="--i:' + i + '"><b>' + esc(t.name) + "</b><small>" + esc(t.category || "") + "</small></div>";
      }).join("");
    }
    function render() {
      [].forEach.call(root.querySelectorAll(".op"), function (el) {

      pvt.textContent = PLAN[sel].tag;
      rows.innerHTML = rowsFor(sel).map(function (r, i) {

      }).join("");
      renderAA();
      setCta(sel === "free" ? "Get " + N + " — Free" : sel === "cust" ? "See Customization" : "Get " + PLAN[sel].name + " — " + money(C.tiers[sel].price));
      cta.href = sel === "cust" ? track(C.ku.page, "cust_card") : track(C.tiers[sel].url, sel);
      root.querySelector(".bs").hidden = !hasKit(sel); /* the kit line follows the picked plan */
      /* the bonus kit is delivered by the paid checkout only — never promise it next to the free remix */
      root.querySelector(".sct").textContent = sel === "cust" ? "Opens the three setup packages · new tab" : sel === "free" ? "Opens the remix in Framer · new tab · no email" : "Secure checkout by Lemon Squeezy · opens in a new tab";
    }
    function pick(k, focus) {

    var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function (es) {

    }, { root: sc, threshold: 0.1 }) : null;
    function reveal() {
      [].forEach.call(root.querySelectorAll(".rv"), function (el) {

    }
    function progress() {

    sc.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(progress); } }, { passive: true });

    function lock(on) {
      var de = document.documentElement, b = document.body;

        de.style.overflow = locked[0]; b.style.overflow = locked[1]; locked = null;
        try { if (window.lenis && window.lenis.start) window.lenis.start(); } catch (e) {}

    }
    function open(from) {
      clearTimeout(closing);
      lastFocus = from || null;
      if (host.nextElementSibling) document.body.appendChild(host); /* stay above anything added later */
      if (!imgs) {
        imgs = true;
        [].forEach.call(root.querySelectorAll("img[data-src]"), function (im) { im.src = im.getAttribute("data-src"); });
      }
      sel = (CUST && from && from.getAttribute && from.getAttribute("data-open") === "get") ? "cust" : "all"; /* Get template → Customization; Get All-Access → All-Access */
      showAll = false;
      [].forEach.call(root.querySelectorAll(".qa.open"), function (q) { q.classList.remove("open"); q.firstChild.setAttribute("aria-expanded", "false"); });

    function close() {
      ov.classList.remove("open");

        if (lastFocus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }

    }
    function collapse(on, keep) {
      st.hidden = on;
      mini.hidden = !on;
      if (!on) st.classList.add("in");
      if (keep !== false) ss("sfbar4-min", on ? "1" : "0");
    }
    function shelf() {
      function apply(S) {
        if (!S || !S.ALLACCESS || !S.ALLACCESS.value) return;
        AA.count = S.ALLACCESS.count || AA.count;
        AA.value = S.ALLACCESS.value;
        AA.list = (S.TEMPLATES || []).map(function (t) { return { name: t.name, category: t.category }; });
        var w = $(".aa-was");

      if (window.SF && window.SF.ALLACCESS) { apply(window.SF); return; }
      var s = document.createElement("script");
      s.src = C.dataJs;
      s.async = true;
      s.onload = function () { try { apply(window.SF); } catch (e) {} };
      document.head.appendChild(s);
    }

    root.addEventListener("click", function (e) {
      var el = e.target && e.target.closest ? e.target.closest("[data-open],[data-x],[data-pick],[data-k],[data-more],[data-q],.sx,.mini") : null;
      if (!el) return;
      if (el.hasAttribute("data-open")) open(el);
      else if (el.hasAttribute("data-x")) close();
      else if (el.hasAttribute("data-pick")) pick(el.getAttribute("data-pick"));
      else if (el.hasAttribute("data-k")) pick(el.getAttribute("data-k"));

      var i = ORDER.indexOf(sel), n = null;
      if (e.key === "ArrowDown" || e.key === "ArrowRight") n = ORDER[(i + 1) % ORDER.length];
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") n = ORDER[(i + ORDER.length - 1) % ORDER.length];
      if (n) { e.preventDefault(); pick(n, true); }

    root.addEventListener("keydown", function (e) {
      if (ov.hidden || e.key !== "Tab") return;
      var f = [].slice.call(cd.querySelectorAll("button,a[href]")).filter(function (x) { return x.offsetParent !== null && x.tabIndex !== -1; });
      if (!f.length) return;

    render();
    var wait = Math.max(900, 3000 - (window.performance && performance.now ? performance.now() : 0));
    /* C.hold = a full-screen intro (CAIRN's first-visit door): the stack waits until it has gone */
    function holding() {
      var h = C.hold && document.querySelector(C.hold);
      if (!h) return false;
      var r = h.getBoundingClientRect(), s = getComputedStyle(h);
      return r.width > 0 && r.height > 0 && s.display !== "none" && s.visibility !== "hidden" && +s.opacity > 0.05;

    /* the SoloFoundry Assistant floats bottom-right on the free demos: keep the stack above its bubble,

    function showStack() { /* never "reveal": that is the card's scroll-reveal below (09-11 name-collision bug) */
      if (holding()) { setTimeout(showStack, 500); return; }
      if (ss("sfbar4-min") === "1") collapse(true);
      else if (window.innerHeight < 480 || window.innerWidth < 720) collapse(true, false); /* landscape phones start as the small pill */
      else st.classList.add("in");
